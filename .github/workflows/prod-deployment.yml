name: Prod Deployment

on:
  # PR ではテストとビルドまで（ECRへのプッシュは行わない）
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/spring-batch-app-v1/**'
      - '.github/workflows/**'
  # main へのマージ時にECRへプッシュする
  push:
    branches: [ main ]
    paths:
      - 'apps/spring-batch-app-v1/**'
      - '.github/workflows/**'
  # 手動実行
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 同一ブランチでの重複実行を避ける（プッシュ中のジョブは中断しない）
concurrency:
  group: prod-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ###############################################################################
  # ユニットテスト
  ###############################################################################
  test:
    uses: ./.github/workflows/unit-test.yml

  ###############################################################################
  # Docker イメージのビルド
  ###############################################################################
  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      ecr_repository: spring-batch-v1-prod-spring-batch-app-v1

  ###############################################################################
  # ECR へのプッシュ（PR では実行しない）
  ###############################################################################
  push:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/push.yml
    with:
      aws_region: ap-northeast-1
      ecr_repository: spring-batch-v1-prod-spring-batch-app-v1
      # ロールのARNは秘密情報ではない（OIDCの信頼ポリシーで呼び出し元を制限している）
      aws_deploy_role_arn: arn:aws:iam::217117561102:role/spring-batch-v1-prod-github-actions-spring-batch

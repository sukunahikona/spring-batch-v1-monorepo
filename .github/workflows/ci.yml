name: CI

# JUnit テスト。PR の作成時と、その PR ブランチへのコミット時に実行する。
# deploy.yml からも呼び出される（デプロイ前のテスト）。
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spring-batch-app-v1
    # Docker Hub の匿名 pull はレート制限に掛かりやすいため、認証して取得する
    # （ユーザー名は Repository variables、トークンは Repository secrets に登録する）
    container:
      image: gradle:jdk21
      credentials:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: batchdb
          POSTGRES_USER: batchuser
          POSTGRES_PASSWORD: batchpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: gradle test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/batchdb
          SPRING_DATASOURCE_USERNAME: batchuser
          SPRING_DATASOURCE_PASSWORD: batchpass

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/spring-batch-app-v1/build/reports/tests/test/
          # 既定は90日。テストレポートは短期間見られれば十分なので14日で自動削除する
          retention-days: 14

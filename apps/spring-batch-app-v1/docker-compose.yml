version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: batch-app-postgres
    environment:
      POSTGRES_DB: batchdb
      POSTGRES_USER: batchuser
      POSTGRES_PASSWORD: batchpass
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初回起動時（データ領域が空のとき）だけ、ファイル名順に実行される
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    restart: unless-stopped

  batch-app:
    build:
      context: .
      dockerfile: batch/Dockerfile
      # SSL スキャンなどで証明書エラーになる環境向けの追加CA証明書（ビルド時のみ。環境変数 EXTRA_CA_CERT_FILE で指定）
      secrets:
        - extra_ca
    container_name: batch-app
    environment:
      JOB_NAME: ${JOB_NAME:-sampleJob}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/batchdb
      SPRING_DATASOURCE_USERNAME: batchuser
      SPRING_DATASOURCE_PASSWORD: batchpass
      TZ: Asia/Tokyo
    depends_on:
      - postgres
    networks:
      - default

secrets:
  extra_ca:
    # 未設定のときは空ファイルを渡し、Dockerfile 側で何もしない
    file: ${EXTRA_CA_CERT_FILE:-./batch/certs/no-extra-ca}

volumes:
  postgres_data:
    driver: local